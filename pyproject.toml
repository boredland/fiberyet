[project]
name = "fiberyet"
version = "0.1.0"
description = "Measured per-address FTTH availability map, Frankfurt pilot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "playwright>=1.48",
    "pyproj>=3.6",
    "scipy>=1.13",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
fiberyet = "fiberyet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiberyet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E9"]
