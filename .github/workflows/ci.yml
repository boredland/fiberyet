name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Catches syntax slips and duplicate or unused names before the tests run.
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q

  site-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --frozen
      - run: npm ci
      # The command Cloudflare Workers Builds runs, against the real data/ in this checkout.
      - name: npm run build (real data)
        run: npm run build
      - name: Build the site from a synthetic data dir
        run: |
          uv run python scripts/synthetic_data.py "$RUNNER_TEMP/fy-data"
          DATA_DIR="$RUNNER_TEMP/fy-data" bash scripts/build_site.sh
      - run: npx playwright install --with-deps chromium
      - name: Drive it in a real browser
        run: |
          (python3 -m http.server -d dist 8765 >/dev/null 2>&1 &)
          sleep 1
          node scripts/check_site.mjs http://127.0.0.1:8765
