# Measures in short slices and commits data/ to main once per slice, with the counts in the commit
# message. Cloudflare Workers Builds deploys on each push to main (build: `npm run build`), so there
# is no deploy job here. Same shape as trinkhallen-data's enrich.yml: a wall-clock budget inside the
# job timeout, per-provider concurrency, and a stats block in every commit.
name: crawl
run-name: crawl · ${{ inputs.provider || 'all' }}

on:
  # The hourly schedule is added back once three manual slices have run clean (see the PR history).
  workflow_dispatch:
    inputs:
      provider:
        description: "telekom, or all"
        default: all
      budget_minutes:
        description: "crawl budget per slice, 1-330. The job timeout is this plus 10 minutes."
        default: "45"

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      providers: ${{ steps.pick.outputs.providers }}
      budget: ${{ steps.pick.outputs.budget }}
      timeout_min: ${{ steps.pick.outputs.timeout_min }}
    steps:
      # Inputs reach the shell only through env, and only after an allowlist / range check.
      - id: pick
        env:
          PROVIDER: ${{ inputs.provider }}
          BUDGET: ${{ inputs.budget_minutes }}
        run: |
          case "${PROVIDER:-all}" in
            all) providers='["telekom","einsundeins","tng"]' ;;
            telekom|einsundeins|tng) providers='["'"$PROVIDER"'"]' ;;
            *) echo "unknown provider" >&2; exit 1 ;;
          esac
          budget="${BUDGET:-45}"
          case "$budget" in
            ''|*[!0-9]*) echo "budget must be a whole number of minutes" >&2; exit 1 ;;
          esac
          if [ "$budget" -lt 1 ] || [ "$budget" -gt 330 ]; then
            echo "budget must be 1-330" >&2; exit 1
          fi
          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo "budget=$budget" >> "$GITHUB_OUTPUT"
          echo "timeout_min=$((budget + 10))" >> "$GITHUB_OUTPUT"

  crawl:
    needs: select
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: ${{ fromJSON(needs.select.outputs.timeout_min) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.select.outputs.providers) }}
    concurrency:
      group: crawl-${{ matrix.provider }}
      cancel-in-progress: false
    env:
      FIBERYET_PROXY: ${{ vars.FIBERYET_PROXY }}
      FETCH_PROXY_URL: ${{ secrets.FETCH_PROXY_URL }}
      FETCH_PROXY_TOKEN: ${{ secrets.FETCH_PROXY_TOKEN }}
      CRAWL_PAUSE_S: ${{ vars.CRAWL_PAUSE_S }}
      PROVIDER: ${{ matrix.provider }}
      BUDGET: ${{ needs.select.outputs.budget }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Crawl one slice
        run: uv run fiberyet advance --provider "$PROVIDER" --budget-minutes "$BUDGET" --flush-rows 100
      # advance commits and pushes once, at the end, with the counts in the message. This step only
      # catches a run that died before it could (rows flushed to data/ but never committed).
      - name: Backstop save
        if: always()
        run: uv run fiberyet save-and-push --provider "$PROVIDER"
